[project.urls]
Homepage = "https://rasa.com"
Repository = "https://github.com/rasahq/rasa"
Documentation = "https://rasa.com/docs"

[project.scripts]
rasa = "rasa.__main__:main"

[tool.ruff]
ignore = ["D100", "D104", "D105", "RUF001", "RUF002", "RUF003", "RUF005"]
line-length = 88
select = ["D", "E", "F", "W", "RUF"]

[tool.ruff.pydocstyle]
convention = "google"

[tool.ruff.per-file-ignores]
"tests/test_telemetry.py" = ["E501"]
"tests/shared/core/test_domain.py" = ["E501"]

[tool.black]
line-length = 88
target-version = ["py312"]
exclude = "((.eggs | .git | .pytest_cache | build | dist))"

[tool.mypy]
mypy_path = "./stubs"
ignore_missing_imports = true
show_error_codes = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_calls = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = false
disable_error_code = ["arg-type"]

[tool.bandit]
skips = ["B104", "B301"]

[tool.towncrier]
package = "rasa"
package_dir = "rasa"
filename = "CHANGELOG.mdx"
directory = "./changelog"
underlines = "   "
title_format = "## [{version}] - {project_date}"
template = "./changelog/_template.md.jinja2"
start_string = "<!-- TOWNCRIER -->\n"
issue_format = "[#{issue}](https://github.com/rasahq/rasa/issues/{issue})"

[[tool.towncrier.type]]
directory = "removal"
name = "Deprecations and Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "improvement"
name = "Improvements"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Improved Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous internal changes"
showcontent = false

[tool.pytest.ini_options]
pythonpath = ["."]
python_functions = "test_"
filterwarnings = ["ignore::ResourceWarning:ruamel[.*]"]
log_cli_level = "WARNING"
log_cli = true
markers = [
    "skip_on_windows",
    "skip_on_ci",
    "sequential",
    "category_cli",
    "category_core_featurizers",
    "category_policies",
    "category_nlu_featurizers",
    "category_nlu_predictors",
    "category_full_model_training",
    "category_other_unit_tests",
    "category_performance",
    "flaky",
]
timeout = 60
timeout_func_only = true
asyncio_mode = "auto"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["rasa*"]

[tool.setuptools.package-data]
"*" = ["**/*.yml", "**/*.yaml", "**/*.html"]

[tool.uv]
# aiogram 2.25 pins aiohttp<3.9, which has no Python 3.12 wheels. The 2.25
# code works with aiohttp 3.11; upstream closed the pin bump as not planned.
override-dependencies = [
    "aiohttp==3.11.18",
    # rasa-sdk HEAD pins deprecated==3.0.0. pydoc-markdown still declares deprecated<2.
    "deprecated==3.0.0",
]

[tool.uv.sources]
rasa-sdk = { git = "https://github.com/sfahad1414/rasa-sdk.git" }
mitie = { git = "https://github.com/mit-nlp/MITIE.git" }
