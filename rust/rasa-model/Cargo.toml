[package]
name = "rasa-model"
version = "0.1.0"
edition = "2021"
description = "Train, load, and serve a Rasa model through the Python Agent from Rust"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
pyo3 = { version = "0.25", features = ["auto-initialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
